<!DOCTYPE html>
<html lang="{{ t.html_lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t.title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon-32.png') }}" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
</head>
<body>
  <main class="wide">
    <div class="lang-switch">
      <a href="{{ url_for('index') }}?lang={{ lang }}">{{ t.index_link_label }}</a>
      <a href="?lang={{ t.lang_switch_target }}">{{ t.lang_switch_label }}</a>
    </div>
    <h1>{{ t.heading }}</h1>
    <p class="hint">{{ t.hint }}</p>

    <section class="read-card">
      <textarea id="text" class="read-text translate-text" placeholder="{{ t.text_placeholder }}"></textarea>

      <div class="read-controls">
        <button type="button" data-sl="en" data-tl="zh-CN">{{ t.en_to_zh }}</button>
        <button type="button" data-sl="zh-CN" data-tl="en">{{ t.zh_to_en }}</button>
        <button type="button" id="clear" class="secondary">{{ t.clear }}</button>
      </div>

      <p id="status" class="read-status"></p>
      <div id="out" class="translate-out" hidden></div>
      <div id="out-tools" class="read-tools" hidden>
        <button type="button" id="copy">{{ t.copy }}</button>
      </div>
    </section>
  </main>

  <script>
  (function () {
    var T = {{ t | tojson }};
    var API = "https://translate.googleapis.com/translate_a/single?client=gtx&dt=t";
    var CHUNK = 1500;  // characters per request, keeps each URL short
    var textEl = document.getElementById("text");
    var statusEl = document.getElementById("status");
    var outEl = document.getElementById("out");
    var outTools = document.getElementById("out-tools");
    var busy = false;

    function googleUrl(text, sl, tl) {
      return "https://translate.google.com/?sl=" + sl + "&tl=" + tl +
             "&op=translate&text=" + encodeURIComponent(text.slice(0, 4000));
    }

    // Split on paragraph/line breaks, then on sentence ends, so no chunk exceeds CHUNK.
    function chunks(text) {
      var parts = text.split(/(\n+)/), out = [], cur = "";
      parts.forEach(function (p) {
        while (p.length > CHUNK) {
          var cut = Math.max(p.lastIndexOf(". ", CHUNK), p.lastIndexOf("。", CHUNK));
          cut = cut > 0 ? cut + 1 : CHUNK;
          if (cur) { out.push(cur); cur = ""; }
          out.push(p.slice(0, cut)); p = p.slice(cut);
        }
        if ((cur + p).length > CHUNK) { out.push(cur); cur = ""; }
        cur += p;
      });
      if (cur) out.push(cur);
      return out;
    }

    function translateChunk(text, sl, tl) {
      if (!text.trim()) return Promise.resolve(text);
      var url = API + "&sl=" + sl + "&tl=" + tl + "&q=" + encodeURIComponent(text);
      return fetch(url).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      }).then(function (data) {
        return data[0].map(function (seg) { return seg[0]; }).join("");
      });
    }

    function fail(text, sl, tl) {
      statusEl.innerHTML = "";
      statusEl.appendChild(document.createTextNode(T.failed + " "));
      var a = document.createElement("a");
      a.href = googleUrl(text, sl, tl); a.target = "_blank"; a.rel = "noopener";
      a.textContent = T.open_google;
      statusEl.appendChild(a);
    }

    document.querySelectorAll("button[data-sl]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var text = textEl.value.trim();
        if (!text) { statusEl.textContent = T.nothing; return; }
        if (busy) return;
        busy = true;
        var sl = btn.dataset.sl, tl = btn.dataset.tl;
        var list = chunks(text), done = [];
        outEl.hidden = true; outTools.hidden = true;
        statusEl.textContent = T.working;
        list.reduce(function (p, c) {
          return p.then(function () {
            return translateChunk(c, sl, tl).then(function (r) { done.push(r); });
          });
        }, Promise.resolve()).then(function () {
          outEl.textContent = done.join("");
          outEl.hidden = false; outTools.hidden = false;
          statusEl.textContent = "";
        }).catch(function () { fail(text, sl, tl); })
          .then(function () { busy = false; });
      });
    });

    document.getElementById("copy").addEventListener("click", function () {
      navigator.clipboard.writeText(outEl.textContent).then(function () {
        statusEl.textContent = T.copied;
      });
    });

    document.getElementById("clear").addEventListener("click", function () {
      textEl.value = "";
      statusEl.textContent = "";
      outEl.textContent = ""; outEl.hidden = true; outTools.hidden = true;
      textEl.focus();
    });
  })();
  </script>
</body>
</html>
