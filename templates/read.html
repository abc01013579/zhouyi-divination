<!DOCTYPE html>
<html lang="{{ t.html_lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t.title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon-32.png') }}" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
</head>
<body>
  <main class="wide">
    <div class="lang-switch">
      <a href="{{ url_for('index') }}?lang={{ lang }}">{{ t.index_link_label }}</a>
      <a href="?lang={{ t.lang_switch_target }}">{{ t.lang_switch_label }}</a>
    </div>
    <h1>{{ t.heading }}</h1>
    <p class="hint">{{ t.hint }}</p>

    <section class="read-card">
      <textarea id="text" class="read-text" placeholder="{{ t.text_placeholder }}"></textarea>

      <div class="read-tools">
        <label class="read-file">
          {{ t.file_label }}
          <input type="file" id="file" accept=".pdf,.txt,application/pdf,text/plain">
        </label>
        <button type="button" id="clear">{{ t.clear }}</button>
      </div>

      <div class="read-controls">
        <button type="button" id="play">{{ t.play }}</button>
        <button type="button" id="stop" class="secondary">{{ t.stop }}</button>

        <div class="read-settings">
          <label>
            {{ t.rate_label }} <span id="rate-value">1.0</span>
            <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="1">
          </label>
        </div>
      </div>

      <p id="status" class="read-status"></p>
      <p id="now" class="read-now"></p>
    </section>
  </main>

  <script>
  (function () {
    var T = {{ t | tojson }};
    var PDFJS_BASE = "https://unpkg.com/pdfjs-dist@3.11.174/";

    var textEl = document.getElementById("text");
    var fileEl = document.getElementById("file");
    var clearEl = document.getElementById("clear");
    var playEl = document.getElementById("play");
    var stopEl = document.getElementById("stop");
    var rateEl = document.getElementById("rate");
    var rateValueEl = document.getElementById("rate-value");
    var statusEl = document.getElementById("status");
    var nowEl = document.getElementById("now");

    var synth = window.speechSynthesis;
    var chunks = [];        // [{lang: "zh" | "en" | "ja" | ..., text: "..."}]
    var missing = {};       // languages skipped for want of a voice, this run
    var builtFrom = null;   // the text chunks were made from
    var idx = 0;            // next chunk to read
    var playing = false;
    var run = 0;            // bumped on every start/stop, so a stale onend does nothing

    // ---- saved settings (this device only) ----
    function load(key) { try { return localStorage.getItem("read." + key); } catch (e) { return null; } }
    function save(key, v) { try { localStorage.setItem("read." + key, v); } catch (e) {} }

    textEl.value = load("text") || "";
    if (load("rate")) rateEl.value = load("rate");
    rateValueEl.textContent = Number(rateEl.value).toFixed(1);

    function fill(s, vars) {
      return s.replace(/\{(\w+)\}/g, function (m, k) { return vars[k]; });
    }
    function setStatus(s) { statusEl.textContent = s || ""; }

    // ---- splitting text into chunks a voice can read ----
    // ten languages: zh en ja es fr pt ru ar hi bn.  The script tells most
    // apart; Han is Japanese when kana is around; Latin text is told
    // apart by its common words.
    var DANDA = /[।॥]/;                  // । ॥  shared by Hindi and Bengali
    var KANA = /[぀-ヿㇰ-ㇿｦ-ﾟ]/;
    var HAN = /[　-〿㐀-䶿一-鿿豈-﫿＀-￯]/;
    var LATIN = /[A-Za-zÀ-ɏ]/;
    var CYRILLIC = /[Ѐ-ӿ]/;
    var ARABIC = /[؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿]/;
    var DEVANAGARI = /[ऀ-ॿ]/;
    var BENGALI = /[ঀ-৿]/;
    var MAXCHUNK = 180;

    // scriptOf:  what a character is written in; null for digits,
    // spaces and punctuation, which go with whatever run they're in
    function scriptOf(ch) {
      if (DANDA.test(ch)) return null;
      if (KANA.test(ch)) return "ja";
      if (HAN.test(ch)) return "han";
      if (LATIN.test(ch)) return "latin";
      if (CYRILLIC.test(ch)) return "ru";
      if (ARABIC.test(ch)) return "ar";
      if (DEVANAGARI.test(ch)) return "hi";
      if (BENGALI.test(ch)) return "bn";
      return null;
    }

    // common words, enough to tell the four Latin-script languages apart
    var WORDS = {
      en: "the and of to is that it with for this was are have you not be by from which they we at or but his her an were has had been would there their what will can",
      es: "el la los las de del que y en un una es por con para se su al lo como más pero sus le ya este porque esta entre cuando muy sin sobre también hay fue está son",
      fr: "le la les de des et est une un du que qui en dans pour pas sur au ce il elle avec ne se plus par sont mais nous vous ou où été être cette aux je",
      pt: "de da das dos que e em um uma é para com não por mais na se como mas ao ele ela também são foi muito pelo pela isso já está ou"
    };
    var WORDSET = {};
    Object.keys(WORDS).forEach(function (l) {
      WORDSET[l] = {};
      WORDS[l].split(" ").forEach(function (w) { WORDSET[l][w] = true; });
    });
    var MARKS = [[/[ñ¿¡]/g, { es: 3 }], [/[ãõ]/g, { pt: 3 }], [/[œèëïîûù]/g, { fr: 2 }],
                 [/[çê]/g, { fr: 1, pt: 1 }]];

    // latinLang:  "en" | "es" | "fr" | "pt" when the text says so clearly,
    // else null
    function latinLang(text) {
      var score = { en: 0, es: 0, fr: 0, pt: 0 };
      var low = text.toLowerCase();
      (low.match(/\p{L}+/gu) || []).forEach(function (w) {
        for (var l in score) if (WORDSET[l][w]) score[l]++;
      });
      MARKS.forEach(function (m) {
        var n = (low.match(m[0]) || []).length;
        for (var l in m[1]) score[l] += n * m[1][l];
      });
      var order = Object.keys(score).sort(function (a, b) { return score[b] - score[a]; });
      if (score[order[0]] >= 2 && score[order[0]] > score[order[1]]) return order[0];
      return null;
    }

    // runs:  split one sentence where its language changes;
    // ctx gives the whole text's guess for Han and Latin when the
    // sentence alone can't tell
    function runs(sentence, ctx) {
      var raw = [], cur = null, lead = "";
      for (var ch of sentence) {
        var s = scriptOf(ch);
        if (s === null) {
          if (cur) cur.text += ch; else lead += ch;
        } else if (cur && cur.lang === s) {
          cur.text += ch;
        } else {
          cur = { lang: s, text: (cur ? "" : lead) + ch };
          raw.push(cur);
        }
      }
      var kana = raw.some(function (r) { return r.lang === "ja"; });
      var latin = raw.some(function (r) { return r.lang === "latin"; })
                ? latinLang(sentence) || ctx.latin : null;
      var out = [];
      raw.forEach(function (r) {
        var lang = r.lang === "han" ? (kana || ctx.ja ? "ja" : "zh")
                 : r.lang === "latin" ? latin : r.lang;
        var last = out[out.length - 1];
        if (last && last.lang === lang) last.text += r.text;
        else out.push({ lang: lang, text: r.text });
      });
      return out;
    }

    // cut:  split a long run at a comma or space so no chunk is too long
    function cut(run) {
      var out = [], s = run.text;
      while (s.length > MAXCHUNK) {
        var head = s.slice(0, MAXCHUNK);
        var at = Math.max(head.lastIndexOf("，"), head.lastIndexOf(","),
                          head.lastIndexOf("、"), head.lastIndexOf("،"),
                          head.lastIndexOf(" "));
        if (at < MAXCHUNK / 3) at = MAXCHUNK - 1;
        out.push({ lang: run.lang, text: s.slice(0, at + 1) });
        s = s.slice(at + 1);
      }
      out.push({ lang: run.lang, text: s });
      return out;
    }

    function makeChunks(text) {
      // one line break inside a paragraph (common in PDFs) is not a stop:
      // between two Chinese characters it just goes, elsewhere it's a space
      var flat = text.replace(/\r/g, "").replace(/([^\n])[ \t]*\n(?!\n)[ \t]*(.?)/gu,
        function (m, before, after) {
          return before + (HAN.test(before) && HAN.test(after) ? "" : " ") + after;
        });
      flat = flat.replace(/([.!?;:])\s+/g, "$1\n\n");   // Latin sentence ends
      var sentences = flat.match(/[^。！？；!?;؟؛।॥\n]+[。！？；!?;؟؛।॥]*|\n+/g) || [];
      var kanaCount = (flat.match(new RegExp(KANA.source, "g")) || []).length;
      var hanCount = (flat.match(new RegExp(HAN.source, "g")) || []).length;
      var ctx = {
        ja: kanaCount > 0 && kanaCount * 5 >= hanCount,  // mostly-kanji lines in a Japanese text
        latin: latinLang(flat) || "en"
      };
      var out = [];
      sentences.forEach(function (s) {
        runs(s, ctx).forEach(function (r) {
          cut(r).forEach(function (c) {
            if (/[\p{L}\p{N}]/u.test(c.text)) out.push(c);
          });
        });
      });
      return out;
    }

    // ---- voices: picked automatically, one per language ----
    // preferred regions first; the first is also the tag used when a
    // browser lists no voices at all
    var PREFER = {
      en: ["en-us", "en-gb", "en-au", "en-ca", "en-in"],
      zh: ["zh-cn", "zh-tw", "zh-hk"],
      ja: ["ja-jp"],
      es: ["es-es", "es-mx", "es-us"],
      fr: ["fr-fr", "fr-ca"],
      pt: ["pt-br", "pt-pt"],
      ru: ["ru-ru"],
      ar: ["ar-sa", "ar-001", "ar-eg"],
      hi: ["hi-in"],
      bn: ["bn-in", "bn-bd"]
    };
    // Apple's joke voices, never wanted for reading
    var NOVELTY = /^(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|ralph|fred|kathy)\b/i;
    var GOOD = /premium|enhanced|natural|neural|google|siri/i;
    var chosen = {};        // lang -> voice, reset when the voice list changes

    function tagOf(v) { return v.lang.replace("_", "-").toLowerCase(); }

    // rank:  lower is better -- region first, then quality
    function rank(v, lang) {
      var i = PREFER[lang].indexOf(tagOf(v));
      var s = (i < 0 ? PREFER[lang].length : i) * 10;
      if (NOVELTY.test(v.name)) s += 1000;
      if (GOOD.test(v.name)) s -= 4;
      if (v.default) s -= 2;
      return s;
    }

    function voiceFor(lang) {
      if (!(lang in chosen)) {
        var list = synth.getVoices().filter(function (v) {
          var t = tagOf(v);
          return t === lang || t.indexOf(lang + "-") === 0;
        });
        list.sort(function (a, b) { return rank(a, lang) - rank(b, lang); });
        chosen[lang] = list[0] || null;
      }
      return chosen[lang];
    }

    function langName(code) {
      try { return new Intl.DisplayNames([T.html_lang], { type: "language" }).of(code); }
      catch (e) { return code; }
    }

    // ---- playing ----
    function speakNext(myRun) {
      if (myRun !== run || !playing) return;
      if (idx >= chunks.length) {
        var gone = Object.keys(missing).map(langName);
        finish(T.done + (gone.length ? " " + fill(T.no_voice, { langs: gone.join(", ") }) : ""));
        return;
      }
      var c = chunks[idx];
      var v = voiceFor(c.lang);
      if (!v && synth.getVoices().length > 0) {
        missing[c.lang] = true;     // this device has no voice for it: skip
        idx++;
        speakNext(myRun);
        return;
      }
      var u = new SpeechSynthesisUtterance(c.text);
      u.lang = v ? v.lang : PREFER[c.lang][0];
      if (v) u.voice = v;
      u.rate = Number(rateEl.value);
      u.onend = function () {
        if (myRun !== run) return;
        idx++;
        speakNext(myRun);
      };
      u.onerror = function (e) {
        if (myRun !== run || e.error === "interrupted" || e.error === "canceled") return;
        idx++;                      // skip a chunk the voice couldn't read
        speakNext(myRun);
      };
      nowEl.textContent = c.text.trim();
      setStatus((idx + 1) + " / " + chunks.length);
      synth.speak(u);
    }

    // chosenText:  the selected text; else from the cursor to the end;
    // else (no cursor, or cursor at the very end) all of it
    function chosenText() {
      var text = textEl.value, a = textEl.selectionStart, b = textEl.selectionEnd;
      if (a !== b) return text.slice(a, b);
      if (a > 0 && a < text.length) return text.slice(a);
      return text;
    }

    function start() {
      if (!synth) { setStatus(T.no_speech); return; }
      var key = textEl.selectionStart + ":" + textEl.selectionEnd + ":" + textEl.value;
      if (key !== builtFrom) {      // new text or new selection: start from its top
        chunks = makeChunks(chosenText());
        builtFrom = key;
        idx = 0;
      }
      if (chunks.length === 0) { setStatus(T.nothing); return; }
      if (idx >= chunks.length) idx = 0;
      if (idx === 0) missing = {};
      playing = true;
      run++;
      if (synth.speaking || synth.pending)
        synth.cancel();
      playEl.textContent = T.pause;
      speakNext(run);
    }

    // pause:  stop speaking, but keep idx -- resume repeats the current chunk
    function pause() {
      playing = false;
      run++;
      synth.cancel();
      playEl.textContent = T.resume;
    }

    function finish(message) {
      playing = false;
      run++;
      if (synth) synth.cancel();
      idx = 0;
      playEl.textContent = T.play;
      nowEl.textContent = "";
      setStatus(message);
    }

    playEl.addEventListener("click", function () {
      if (playing) pause(); else start();
    });
    stopEl.addEventListener("click", function () { finish(""); });

    textEl.addEventListener("input", function () {
      save("text", textEl.value);
      if (!playing && builtFrom !== null) {
        builtFrom = null;
        idx = 0;
        playEl.textContent = T.play;
      }
    });
    rateEl.addEventListener("input", function () {
      rateValueEl.textContent = Number(rateEl.value).toFixed(1);
      save("rate", rateEl.value);
    });

    // ---- clear ----
    // setText:  replace everything in the box, as if newly loaded
    function setText(text) {
      finish("");
      textEl.value = text;
      save("text", text);
      builtFrom = null;
    }

    clearEl.addEventListener("click", function () {
      setText("");
      textEl.focus();
    });

    // ---- files ----
    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    async function pdfText(file) {
      if (!window.pdfjsLib) {
        await loadScript(PDFJS_BASE + "build/pdf.min.js");
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "build/pdf.worker.min.js";
      }
      var pdf = await window.pdfjsLib.getDocument({
        data: await file.arrayBuffer(),
        cMapUrl: PDFJS_BASE + "cmaps/",     // needed for many Chinese PDFs
        cMapPacked: true,
        standardFontDataUrl: PDFJS_BASE + "standard_fonts/"
      }).promise;
      var pages = [];
      for (var i = 1; i <= pdf.numPages; i++) {
        setStatus(fill(T.loading_pdf, { page: i, pages: pdf.numPages }));
        var content = await (await pdf.getPage(i)).getTextContent();
        var s = "";
        content.items.forEach(function (item) {
          s += item.str;
          if (item.hasEOL) s += "\n";
        });
        pages.push(s);
      }
      return pages.join("\n\n");
    }

    fileEl.addEventListener("change", async function () {
      var file = fileEl.files[0];
      if (!file) return;
      finish("");
      try {
        var isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
        var text = isPdf ? await pdfText(file) : await file.text();
        if (!/[\p{L}\p{N}]/u.test(text)) {
          setStatus(T.no_text);
        } else {
          setText(text.trim());
          setStatus(fill(T.loaded, { name: file.name }));
        }
      } catch (e) {
        setStatus(T.file_error);
      }
      fileEl.value = "";
    });

    if (synth) {
      if ("onvoiceschanged" in synth)
        synth.onvoiceschanged = function () { chosen = {}; };
    } else {
      setStatus(T.no_speech);
      playEl.disabled = true;
    }

  })();
  </script>
</body>
</html>
